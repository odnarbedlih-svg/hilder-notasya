# Configuración General
spring.application.name=NOTASYA - Gestión Académica
server.port=8080

# Base de Datos H2 local (por defecto para ejecución inmediata)
spring.datasource.url=jdbc:h2:mem:notasya_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración OpenAPI Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method

# Carga de datos iniciales
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
