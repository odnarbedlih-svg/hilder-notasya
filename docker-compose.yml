version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: notasya_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: notasya_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: notasya_api
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/notasya_db
      - APP_ENV=production
    ports:
      - "8000:8000"

volumes:
  postgres_data:
